package eu.xenit.gradle.enterprise.conventions.integration.spotless.appliedTooLate

plugins {
    id 'java'
    id 'com.diffplug.spotless'
    id 'eu.xenit.enterprise-conventions.private' apply false
}

description = "Spotless conventions applied too late"

spotless {
    java {
        importOrder('java', 'javax', '')
    }
}

// Applied only here, after the java format was already configured: the conventions plugin registers its
// afterEvaluate after the one Spotless registered, so its defaults would silently never merge in.
apply plugin: 'eu.xenit.enterprise-conventions.private'
