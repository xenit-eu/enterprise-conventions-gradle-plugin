package eu.xenit.gradle.enterprise.conventions.integration.spotless.noJavaPlugin

plugins {
    id 'com.diffplug.spotless'
}

description = "Spotless without the java plugin"

spotless {
    format 'misc', {
        target '*.txt'
        endWithNewline()
    }
}

tasks.register("verifyNoJavaFormat") {
    def javaFormatTask = tasks.findByName("spotlessJava")
    doFirst {
        // The java format infers its target from the java source sets and fails without them,
        // so the conventions plugin must not create it when the java plugin is absent.
        assert javaFormatTask == null: "spotlessJava must not be created without the java plugin"
    }
}
