pluginManagement {
    plugins {
        id 'com.diffplug.spotless' version '8.10.0'
    }
}
plugins {
    id "eu.xenit.enterprise-conventions.private"
}

// expandWildcardImports builds a type solver from the compile classpath, so realizing spotlessJava
// resolves it. This project has a real dependency so that resolution is actually exercised.
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}
