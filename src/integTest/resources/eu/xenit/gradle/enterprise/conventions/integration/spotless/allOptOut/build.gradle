package eu.xenit.gradle.enterprise.conventions.integration.spotless.allOptOut

plugins {
    id 'java'
    id 'com.diffplug.spotless'
}

description = "Project opts out of all conventions defaults"

spotlessConventions {
    enabled = false
}

tasks.register("verifyNoJavaFormat") {
    def javaFormatTask = tasks.findByName("spotlessJava")
    doFirst {
        // Opting out entirely must not even create a java format for the project.
        assert javaFormatTask == null: "spotlessJava must not be created when the conventions are disabled"
    }
}
